[project]
name = "pylarky"
version = "0.0.1"
description = "Python wrapper for starlarky runner"
authors = [{ name = "Very Good Security" }]
license = "Apache-2.0"
readme = "pylarky/README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pylarky*"]
exclude = ["pylarky.tests*"]

[tool.setuptools.package-data]
# The native runner, copied in by build-and-test-python.sh.
pylarky = ["larky-runner"]
