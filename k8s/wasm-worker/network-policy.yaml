apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: larky-wasm-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: larky-wasm-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: atlas-horizon
      ports:
        - protocol: TCP
          port: 8443
  egress: []
