apiVersion: apps/v1
kind: Deployment
metadata:
  name: larky-wasm-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: larky-wasm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: larky-wasm-worker
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: false
      hostNetwork: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      containers:
        - name: gateway
          image: registry.invalid/starlarky-wasm-worker:REPLACE-WITH-DIGEST
          imagePullPolicy: Always
          command: ["/app/gateway.sh"]
          ports:
            - name: mtls
              containerPort: 8443
              protocol: TCP
          env:
            - name: WORKER_KEYSTORE
              value: /var/run/wasm-tls/identity.p12
            - name: WORKER_KEYSTORE_PASSWORD_FILE
              value: /var/run/wasm-tls/key-password
            - name: WORKER_TRUSTSTORE
              value: /var/run/wasm-tls/trust.p12
            - name: WORKER_TRUSTSTORE_PASSWORD_FILE
              value: /var/run/wasm-tls/trust-password
          volumeMounts:
            - name: tls-identity
              mountPath: /var/run/wasm-tls
              readOnly: true
            - name: gateway-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: worker
          image: registry.invalid/starlarky-wasm-worker:REPLACE-WITH-DIGEST
          imagePullPolicy: Always
          command: ["/app/plain-server.sh"]
          env:
            - name: WORKER_PLAIN_PORT
              value: "8081"
          volumeMounts:
            - name: worker-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-identity
          secret:
            secretName: larky-wasm-worker-mtls
            defaultMode: 292 # 0444; only the gateway mounts this volume.
        - name: gateway-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: worker-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
