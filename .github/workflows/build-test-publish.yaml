---
## This workflow implements the following jobs
## - detect on PR which libs are updated
## - build libs
## - for libs: it uses the shared ci lib workflow
##    - package the jar with unit tests
##    - run integrations tests
##    - publish the jar with github tag if event is push.tag
##    - deploy larky-wasm, libstarlark and larky to GitHub Packages on a tag (or on demand for an existing tag)

name: build test and publish

on:
  push:
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.17.0) whose libstarlark and larky jars to publish"
        required: true

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_M2_REPO: ./root-m2

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Cache GraalVM Home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        id: cache-graalvm
        with:
          path: |
            ./.graalvm
          # No restore-keys: a GraalVM cached for another install_graalvm.sh may be for another Java.
          key: ${{ runner.os }}-graalvm-${{ hashFiles('**/install_graalvm.sh') }}

      - name: Cache M2 Repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ${{ env.HOST_M2_REPO }}
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Package jars with tests
        run: |
          # we create the cache folder for the 1st run when action/cache won't restore it
          mkdir -p "$HOST_M2_REPO"
          make test_and_package
        env:
          GITHUB_TOKEN: ${{ secrets.VERYGOODBOT_CIAPPBUILDER_PAT }}

      - name: Upload target directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: maven-target
          path: "**/target/"
          retention-days: 1
          overwrite: "true"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6.5.0
        if: ${{ ! cancelled() }}
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          detailed_summary: true
          group_suite: true
          fail_on_failure: true
          truncate_stack_traces: false
          annotate_only: true

  build-py:
    name: Build py
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Infos
        id: infos
        if: ${{ github.ref_type == 'tag' }}
        run: |
          VERSION=${TAG##*-v}  # remove everything up to and including -v
          VERSION=${VERSION#v} # remove initial v if it's just v1.2.3
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        env:
          TAG: ${{ github.ref_name }}

      - name: Download target directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: maven-target

      - name: Run tests for pylarky
        run: |
          make py_test_and_package

      - name: Upload dist directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-target
          path: "**/dist/*.whl"
          retention-days: 1
          overwrite: "true"

  attach-assets:
    needs: [build, build-py]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download java target directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: maven-target

      - name: Download python target directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-target

      - name: Infos
        id: infos
        run: |
          VERSION=${TAG##*-v}  # remove everything up to and including -v
          VERSION=${VERSION#v} # remove initial v if it's just v1.2.3
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        env:
          TAG: ${{ github.ref_name }}

      - name: Add version to distribution
        run: |
          mv runlarky/target/larky-linux runlarky/target/larky-${VERSION}-linux

      - name: Upload to Release
        run: |
          # Check if a release exists for this tag
          if gh release view ${{ github.ref_name }} &>/dev/null; then
            echo "Release exists, uploading artifact..."
            gh release upload ${{ github.ref_name }} dist/pylarky-*.whl --clobber
            gh release upload ${{ github.ref_name }} runlarky/target/larky-*-linux --clobber
          else
            echo "No release found for tag ${{ github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven:
    name: Publish to GitHub Packages
    # Consumers resolve com.verygood.security:larky and net.starlark.java:libstarlark from
    # maven.pkg.github.com/verygoodsecurity/starlarky; without this, a release only gets its
    # binary and wheel.
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Infos
        run: |
          VERSION=${TAG##*-v}  # remove everything up to and including -v
          VERSION=${VERSION#v} # remove initial v if it's just v1.2.3
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Deploy larky-wasm, libstarlark and larky
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -pl larky-wasm,libstarlark,larky
          mvn -B -ntp versions:set-property -Dproperty=libstarlark.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false -pl larky
          mvn -B -ntp versions:set-property -Dproperty=larky-wasm.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false -pl larky
          mvn -B -ntp deploy -DskipTests -pl larky-wasm,libstarlark,larky
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
